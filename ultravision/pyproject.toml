[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ultravision"
dynamic = ["version"]
description = "Ultra-fast LM Studio + Qwen3-VL batch image processor with concurrency, resume, and rich outputs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "h1ddenpr0cess20" }]
keywords = ["LM Studio", "Qwen", "Vision", "Batch", "OpenAI-compatible", "CLI"]
dependencies = [
    "requests>=2.31.0",
    "rich>=13.7.0",
    "Pillow>=10.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.23.0",
    "python-multipart>=0.0.7",
    "aiohttp>=3.9.0",
    "psutil>=5.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
ultravision = "ultravision.cli:main"
ultravision-web = "ultravision.web.server:main"

[tool.setuptools.dynamic]
version = { attr = "ultravision.__version__" }

[tool.setuptools.packages.find]
include = ["ultravision*"]

[tool.setuptools.package-data]
"ultravision.web" = ["static/**/*"]
